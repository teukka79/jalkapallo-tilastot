name: JalkapalloTilastot
options:
  bundleIdPrefix: fi.teukka
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
targets:
  JalkapalloTilastot:
    type: application
    platform: macOS
    sources:
      - JalkapalloTilastot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.teukka.JalkapalloTilastot
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Config/JalkapalloTilastot.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
  JalkapalloTilastotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: JalkapalloTilastot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.teukka.JalkapalloTilastotTests
schemes:
  JalkapalloTilastot:
    build:
      targets:
        JalkapalloTilastot: all
    test:
      targets:
        - JalkapalloTilastotTests
